name: Generate Django Migrations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  makemigrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check Django
        working-directory: backend
        run: python manage.py check

      - name: Generate migrations
        working-directory: backend
        run: python manage.py makemigrations core --noinput

      - name: Verify generated migration
        run: |
          echo "=== Migration directory ==="
          ls -la backend/core/migrations

          echo "=== Git status ==="
          git status --short

          if [ ! -f backend/core/migrations/0001_initial.py ]; then
            echo "ERROR: 0001_initial.py was not generated."
            exit 1
          fi

          echo "0001_initial.py exists."

      - name: Commit and push migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/core/migrations/0001_initial.py

          if git diff --cached --quiet; then
            echo "Migration is already committed."
            exit 0
          fi

          git commit -m "chore: add initial Django migration"
          git push origin main
