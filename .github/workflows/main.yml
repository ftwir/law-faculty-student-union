name: Generate Django Migrations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  makemigrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check Django
        working-directory: backend
        run: python manage.py check

      - name: Show migration state
        working-directory: backend
        run: python manage.py showmigrations core

      - name: Generate migrations
        working-directory: backend
        run: python manage.py makemigrations core --verbosity 3

      - name: Show generated files
        run: |
          echo "=== backend/core/migrations ==="
          ls -la backend/core/migrations

          echo "=== Git status ==="
          git status --short

      - name: Commit generated migrations
        run: |
          if git diff --quiet; then
            echo "No migration files were generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/core/migrations
          git commit -m "chore: generate django migrations"
          git push
