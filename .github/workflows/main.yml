name: Generate Django Migrations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  makemigrations:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Generate migrations
        run: python manage.py makemigrations core --noinput

      - name: Commit generated migrations
        run: |
          if git diff --quiet; then
            echo "No migration changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/core/migrations
          git commit -m "chore: generate django migrations"
          git push
