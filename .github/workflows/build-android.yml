name: Build New LSU Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Android Platform
        working-directory: client_app
        run: |
          flutter create --platforms=android .

      - name: Flutter Pub Get
        working-directory: client_app
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: client_app
        run: flutter analyze

      - name: Build APK
        working-directory: client_app
        run: flutter build apk --release

      - name: Verify APK
        working-directory: client_app
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: new-lsu-android-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
