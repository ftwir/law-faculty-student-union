name: Build New LSU Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Android Platform
        working-directory: client_app
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart

          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

          icon_source="assets/app_icon/icon.svg"
          test -f "$icon_source"

          declare -A icon_sizes=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )

          for density in "${!icon_sizes[@]}"; do
            size="${icon_sizes[$density]}"
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            rsvg-convert -w "$size" -h "$size" "$icon_source" \
              -o "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" \
              "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>',
              '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>',
              '<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>',
          ]

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          for permission in permissions:
              if permission not in text:
                  text = text.replace(marker, marker + '\n    ' + permission, 1)
          manifest.write_text(text)

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              text = kts.read_text()
              if 'applicationId = "' in text:
                  text = re.sub(
                      r'applicationId = "[^"]+"',
                      'applicationId = "ly.edu.sirt.lawunion"',
                      text,
                      count=1,
                  )
              else:
                  raise SystemExit("Could not locate applicationId in build.gradle.kts.")
              kts.write_text(text)
          elif groovy.exists():
              text = groovy.read_text()
              if "applicationId " in text:
                  text = re.sub(
                      r'applicationId "[^"]+"',
                      'applicationId "ly.edu.sirt.lawunion"',
                      text,
                      count=1,
                  )
              else:
                  raise SystemExit("Could not locate applicationId in build.gradle.")
              groovy.write_text(text)
          else:
              raise SystemExit("No Android app Gradle file was generated.")

          strings_file = Path("android/app/src/main/res/values/strings.xml")
          if strings_file.exists():
              text = strings_file.read_text()
              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">قاعة الاتحاد</string>',
                  text,
              )
              strings_file.write_text(text)
          PY

          echo "Android INTERNET permission:"
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml || true

          echo "Android application ID:"
          if [ -f android/app/build.gradle.kts ]; then
            grep -n "applicationId" android/app/build.gradle.kts
          else
            grep -n "applicationId" android/app/build.gradle
          fi

      - name: Flutter Pub Get
        working-directory: client_app
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: client_app
        run: flutter analyze

      - name: Build APK
        working-directory: client_app
        run: |
          flutter build apk \
            --release \
            --build-name=1.0.0 \
            --build-number=${GITHUB_RUN_NUMBER}

      - name: Verify APK
        working-directory: client_app
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" \
            dump badging "$APK" | head -20
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: new-lsu-android-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
