name: Build New LSU Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ensure Android Platform
        working-directory: client_app
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission,
              )

          manifest.write_text(text)
          PY

          echo "Android INTERNET permission:"
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml || true

      - name: Flutter Pub Get
        working-directory: client_app
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: client_app
        run: flutter analyze

      - name: Build APK
        working-directory: client_app
        run: flutter build apk --release

      - name: Verify APK
        working-directory: client_app
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: new-lsu-android-apk
          path: client_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
