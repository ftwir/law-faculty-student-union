databases:
  - name: law-union-db
    plan: free
    region: frankfurt

services:
  - type: redis
    name: law-union-redis
    plan: free
    region: frankfurt
    ipAllowList: []

  - type: web
    name: law-union-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: law-union-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: law-union-redis
          property: connectionString
